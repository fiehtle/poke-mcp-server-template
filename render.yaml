services:
  - type: web
    name: attio-complement-mcp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python src/server.py
    plan: free
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ATTIO_BASE_URL
        value: https://api.attio.com
      - key: ATTIO_ACCESS_TOKEN
        sync: false
